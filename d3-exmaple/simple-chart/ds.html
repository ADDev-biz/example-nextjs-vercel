<!DOCTYPE html>
<html data-theme="light">
<head>
    <meta charset="utf-8">
    <title>Dynamic Time Period Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <style>
        /* D3 specific styles that need to remain */
        .line {
            fill: none;
            stroke: steelblue;
            stroke-width: 2px;
        }
        
        .area {
            fill: steelblue;
            opacity: 0.2;
        }
        
        .dot {
            fill: steelblue;
            stroke: white;
            stroke-width: 2px;
        }
        
        .axis {
            font-size: 12px;
        }
        
        .grid line {
            stroke: lightgray;
            stroke-opacity: 0.3;
            shape-rendering: crispEdges;
        }
        
        .grid path {
            stroke-width: 0;
        }
        
        .chart-title {
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
        }
        
        .axis-label {
            font-size: 11px;
        }

        /* Ensure chart containers have proper sizing - compact */
        #chart, #chart2 {
            min-height: 200px;
            width: 100%;
        }

        #chart svg, #chart2 svg {
            display: block;
        }
        
        /* Compact body spacing */
        body {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        
        /* Extra compact collapse headers */
        .collapse-title {
            padding-top: 0.5rem !important;
            padding-bottom: 0.5rem !important;
            line-height: 1.2;
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen p-4 pb-12">
    <div class="container mx-auto max-w-5xl">
        <!-- Hero Section with Theme Toggle -->
        <div class="flex flex-col sm:flex-row items-center justify-between mb-4 gap-3">
            <div class="text-center sm:text-left flex-1">
                <h1 class="text-2xl sm:text-3xl font-bold text-primary mb-1">Time Series Visualization</h1>
                <p class="text-xs sm:text-sm text-base-content/70">Interactive D3.js charts</p>
            </div>
            <div class="flex gap-2 items-center">
                <!-- Responsive Badge -->
                <div class="badge badge-outline badge-sm hidden sm:flex">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span id="viewport-size" class="text-xs"></span>
                </div>
                <button class="btn btn-circle btn-ghost btn-xs sm:btn-sm" onclick="toggleTheme()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Unified Time Period Control -->
        <div class="card bg-gradient-to-r from-primary/10 to-secondary/10 shadow-md mb-3">
            <div class="card-body p-3">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span class="text-sm font-semibold">Time Period</span>
                    </div>
                    
                    <!-- Desktop: Button Group -->
                    <div class="hidden md:flex flex-wrap gap-1">
                        <button class="btn btn-xs btn-primary global-time-btn" data-days="30">30D</button>
                        <button class="btn btn-xs btn-outline btn-primary global-time-btn" data-days="60">60D</button>
                        <button class="btn btn-xs btn-outline btn-primary global-time-btn" data-days="120">120D</button>
                        <button class="btn btn-xs btn-outline btn-primary global-time-btn" data-days="365">1Y</button>
                    </div>
                    
                    <!-- Mobile/Tablet: Radio Buttons -->
                    <div class="flex md:hidden flex-col gap-1 w-full">
                        <div class="join join-vertical w-full">
                            <input class="join-item btn btn-xs" type="radio" name="global-time-period" value="30" aria-label="30 Days" checked />
                            <input class="join-item btn btn-xs" type="radio" name="global-time-period" value="60" aria-label="60 Days" />
                            <input class="join-item btn btn-xs" type="radio" name="global-time-period" value="120" aria-label="120 Days" />
                            <input class="join-item btn btn-xs" type="radio" name="global-time-period" value="365" aria-label="1 Year" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Collapsible Chart Component 1 -->
        <div class="collapse collapse-arrow bg-base-100 shadow-md mb-3">
            <input type="checkbox" checked="checked" /> 
            <div class="collapse-title text-sm font-medium bg-primary text-primary-content">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
                    </svg>
                    Primary Time Series
                </div>
            </div>
            <div class="collapse-content bg-base-100 pt-2 px-2 pb-2">
                <!-- Chart Container -->
                <div class="card bg-base-100 shadow-sm mb-2">
                    <div class="card-body p-2">
                        <div id="chart" class="w-full overflow-x-auto"></div>
                    </div>
                </div>

                <!-- Statistics Card -->
                <div class="alert alert-sm py-2 px-3">
                    <div class="w-full">
                        <div class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-info shrink-0 w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <div id="stats" class="text-xs flex-1 break-words">Loading statistics...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Collapsible Chart Component 2 -->
        <div class="collapse collapse-arrow bg-base-100 shadow-md mb-3">
            <input type="checkbox" checked="checked" /> 
            <div class="collapse-title text-sm font-medium bg-secondary text-secondary-content">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    Secondary Metrics
                </div>
            </div>
            <div class="collapse-content bg-base-100 pt-2 px-2 pb-2">
                <!-- Chart Container -->
                <div class="card bg-base-100 shadow-sm mb-2">
                    <div class="card-body p-2">
                        <div id="chart2" class="w-full overflow-x-auto"></div>
                    </div>
                </div>

                <!-- Statistics Card -->
                <div class="alert alert-secondary alert-sm py-2 px-3">
                    <div class="w-full">
                        <div class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <div id="stats2" class="text-xs flex-1 break-words">Loading statistics...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Info Cards - Compact -->
        <div class="flex flex-wrap gap-2 mt-4 text-xs text-base-content/60">
            <div class="badge badge-outline gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                </svg>
                Interactive
            </div>
            <div class="badge badge-outline gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Responsive
            </div>
            <div class="badge badge-outline gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Real-time Ready
            </div>
            <div class="badge badge-outline">D3.js + Tailwind + DaisyUI</div>
        </div>
    </div>

    <script>
        // Theme toggle function
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Update viewport size badge
        function updateViewportSize() {
            const badge = document.getElementById('viewport-size');
            if (badge) {
                const width = window.innerWidth;
                let size = 'Desktop';
                if (width < 640) size = 'Mobile';
                else if (width < 768) size = 'Tablet';
                else if (width < 1024) size = 'Laptop';
                badge.textContent = `${size} (${width}px)`;
            }
        }

        // Initial update
        updateViewportSize();
        
        // Update on resize
        window.addEventListener('resize', updateViewportSize);
    </script>
    <script src="timechart.js"></script>
</body>
</html>
